site_name: tfs-test-runner
site_description: Convert Azure DevOps / TFS xlsx test case exports into a self-contained HTML test execution kit with screenshot capture, status tracking, and PDF evidence export.
site_url: https://luizhcrs.github.io/tfs-test-runner/
site_author: luizhcrs
repo_url: https://github.com/Luizhcrs/tfs-test-runner
repo_name: Luizhcrs/tfs-test-runner
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 luizhcrs · MIT License

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra:
  alternate:
    - name: English
      link: /tfs-test-runner/
      lang: en
    - name: Português (BR)
      link: /tfs-test-runner/pt-BR/
      lang: pt-BR
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Luizhcrs/tfs-test-runner
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/tfs-test-runner/
  generator: false
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols

plugins:
  - search:
      lang:
        - en
        - pt
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          nav_translations:
            Home: Home
            Quickstart: Quickstart
            Usage: Usage
            Architecture: Architecture
            Configuration: Configuration
            Contributing: Contributing
            Changelog: Changelog
        - locale: pt-BR
          name: Português (BR)
          build: true
          site_name: tfs-test-runner
          nav_translations:
            Home: Início
            Quickstart: Início rápido
            Usage: Uso
            Architecture: Arquitetura
            Configuration: Configuração
            Contributing: Contribuindo
            Changelog: Changelog

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Usage: usage.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - Contributing: contributing.md
  - Changelog: changelog.md

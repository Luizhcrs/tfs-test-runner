[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfs-test-runner"
version = "2.1.0"
description = "Convert Azure DevOps / TFS xlsx test case exports into a self-contained HTML execution kit with evidence capture and PDF export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "luizhcrs" }]
keywords = ["azure-devops", "tfs", "test-cases", "test-plan", "evidence", "qa", "xlsx"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["openai>=1.50"]
argos = ["argostranslate>=1.9"]
test = ["pytest>=8.0"]
dev = ["pytest>=8.0", "openai>=1.50", "argostranslate>=1.9", "playwright>=1.50", "mkdocs-material>=9.5", "mkdocs-static-i18n>=1.2"]

[project.urls]
Homepage = "https://github.com/luizhcrs/tfs-test-runner"
Issues = "https://github.com/luizhcrs/tfs-test-runner/issues"

[project.scripts]
tfs-test-runner = "tfs_test_runner.cli:main"

[tool.setuptools]
packages = ["tfs_test_runner"]
include-package-data = true

[tool.setuptools.package-data]
tfs_test_runner = ["template/*.j2", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
